name: backtest-v2

# Replays the v2 engine over a range of months in parallel, then writes data/backtest_<label>/REPORT.md.
# Spec lives in .github/run-backtest (one line):  label=2024 months=2024-01..2024-12 every=2 scan=120
# Start it by pushing a change to that file, or from the Actions tab (uses the file as it is).
on:
  workflow_dispatch:
  push:
    paths: [".github/run-backtest"]

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      label: ${{ steps.p.outputs.label }}
      every: ${{ steps.p.outputs.every }}
      scan: ${{ steps.p.outputs.scan }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          spec = dict(kv.split("=", 1) for kv in open(".github/run-backtest").read().split() if "=" in kv)
          a, b = spec["months"].split("..")
          y, m = map(int, a.split("-")); y2, m2 = map(int, b.split("-"))
          ms = []
          while (y, m) <= (y2, m2):
              ms.append(f"{y}-{m:02d}"); m += 1
              if m > 12: y, m = y + 1, 1
          print("matrix=" + json.dumps({"month": ms}))
          print("label=" + spec.get("label", "run"))
          print("every=" + spec.get("every", "1"))
          print("scan=" + spec.get("scan", "60"))
          PY

  month:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Replay ${{ matrix.month }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m v2.backtest --month ${{ matrix.month }} --out out/${{ matrix.month }} --every ${{ needs.plan.outputs.every }} --scan ${{ needs.plan.outputs.scan }}
      - uses: actions/upload-artifact@v4
        with:
          name: bt-${{ matrix.month }}
          path: out/${{ matrix.month }}

  report:
    needs: [plan, month]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: bt-*
          path: out
      - name: Build report
        run: python -m v2.backtest --aggregate out/bt-* --report data/backtest_${{ needs.plan.outputs.label }}
      - name: Commit report
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add -A data/backtest_${{ needs.plan.outputs.label }}
          git diff --cached --quiet && exit 0
          git commit -q -m "v2 backtest: ${{ needs.plan.outputs.label }} report"
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
