name: backtest-v2

# Replays the v2 engine over every 2025 trading day (12 monthly jobs in parallel), then combines them into
# data/backtest_v2/REPORT.md. Start it from the Actions tab, or touch .github/run-backtest and push.
on:
  workflow_dispatch:
  push:
    paths: [".github/run-backtest"]

permissions:
  contents: write

jobs:
  month:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        month: ["2025-01", "2025-02", "2025-03", "2025-04", "2025-05", "2025-06",
                "2025-07", "2025-08", "2025-09", "2025-10", "2025-11", "2025-12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Replay ${{ matrix.month }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m v2.backtest --month ${{ matrix.month }} --out out/${{ matrix.month }}
      - uses: actions/upload-artifact@v4
        with:
          name: bt-${{ matrix.month }}
          path: out/${{ matrix.month }}

  report:
    needs: month
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: bt-*
          path: out
      - name: Build report
        run: python -m v2.backtest --aggregate out/bt-* --report data/backtest_v2
      - name: Commit report
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add -A data/backtest_v2
          git diff --cached --quiet && exit 0
          git commit -q -m "v2 backtest: 2025 report"
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
