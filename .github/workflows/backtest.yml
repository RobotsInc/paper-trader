name: backtest

on:
  workflow_dispatch:
    inputs:
      months:
        description: "How many months of history to replay"
        required: true
        default: "12"
      slippage_bps:
        description: "Slippage per side in basis points (3 = 0.03%)"
        required: true
        default: "3"
      feed:
        description: "sip (all exchanges, free for history) or iex"
        required: true
        default: sip

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Run backtest
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          BT_MONTHS: ${{ github.event.inputs.months }}
          BT_SLIPPAGE_BPS: ${{ github.event.inputs.slippage_bps }}
          BT_FEED: ${{ github.event.inputs.feed }}
        run: python bot/backtest.py

      - name: Save results to repo
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add -A data/backtest
          git diff --cached --quiet && exit 0
          git commit -q -m "backtest: $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 5; done
