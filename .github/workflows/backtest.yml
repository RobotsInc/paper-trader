name: backtest

on:
  workflow_dispatch:
    inputs:
      months:
        description: "How many months of history to replay"
        required: true
        default: "12"
      slippage_bps:
        description: "Slippage per side in basis points (3 = 0.03%)"
        required: true
        default: "3"
      feed:
        description: "sip (all exchanges, free for history) or iex"
        required: true
        default: sip
      end_date:
        description: "Last day to replay, YYYY-MM-DD (blank = yesterday)"
        required: false
        default: ""
      mode:
        description: "core = the bot's ~110-stock list, all rule sets; wide = live rules on every listed stock >= $5"
        required: false
        default: core
      end_dates:
        description: 'wide mode only: JSON list of window end dates, run 2 at a time'
        required: false
        default: '["2026-11-19","2025-12-31","2022-12-30","2017-12-29"]'

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    if: github.event.inputs.mode != 'wide'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Run backtest
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          BT_MONTHS: ${{ github.event.inputs.months }}
          BT_SLIPPAGE_BPS: ${{ github.event.inputs.slippage_bps }}
          BT_FEED: ${{ github.event.inputs.feed }}
          BT_END: ${{ github.event.inputs.end_date }}
        run: python bot/backtest.py

      - name: Save results to repo
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add -A data/backtest
          git diff --cached --quiet && exit 0
          git commit -q -m "backtest: $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 5; done

  wide:
    if: github.event.inputs.mode == 'wide'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2   # windows share one Alpaca rate limit
      matrix:
        end_date: ${{ fromJSON(github.event.inputs.end_dates) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Run whole-market backtest
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          BT_MONTHS: ${{ github.event.inputs.months }}
          BT_SLIPPAGE_BPS: ${{ github.event.inputs.slippage_bps }}
          BT_END: ${{ matrix.end_date }}
        run: python bot/backtest_wide.py

      - name: Save results to repo
        if: always()
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add -A data/backtest/wide
          git diff --cached --quiet && exit 0
          git commit -q -m "wide backtest ${{ matrix.end_date }}: $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
