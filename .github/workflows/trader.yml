name: paper-trader

on:
  schedule:
    # Every 5 min, 13:00-21:55 UTC on weekdays (covers 9:30-16:00 ET in both EST and EDT).
    # The bot checks Alpaca's market clock itself, so off-hours runs exit quickly.
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "run, flatten (close everything now), or report (rebuild scorecard)"
        required: true
        default: run

permissions:
  contents: write   # commit logs back to the repo
  models: read      # free AI news filter via GitHub Models

concurrency:
  group: paper-trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Run bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_FILTER: ${{ vars.AI_FILTER || 'on' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-4o-mini' }}
        run: python bot/trader.py "${{ github.event.inputs.mode || 'run' }}"

      - name: Save logs to repo
        if: always()
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add -A data SCORECARD.md
          git diff --cached --quiet && exit 0
          git commit -q -m "bot: $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
