name: paper-trader

on:
  schedule:
    # Every 5 min, 13:00-21:55 UTC on weekdays (covers 9:30-16:00 ET in both EST and EDT).
    # The bot checks Alpaca's market clock itself, so off-hours runs exit quickly.
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "run, flatten (close everything now), report (rebuild scorecard), ai (re-run AI desk), rescan (re-run scanner + AI desk), or scantest (dry-run the scanner, no trades)"
        required: true
        default: run

permissions:
  contents: write   # commit logs back to the repo
  actions: read     # see whether the all-day job is already running

concurrency:
  group: paper-trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Skip if the all-day job is running
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/allday.yml/runs?status=in_progress" --jq .total_count 2>/dev/null || echo 0)
          if [ "${{ github.event.inputs.mode || 'run' }}" = run ] && [ "$n" != "0" ]; then
            echo "All-day job is running - this 5-minute run is not needed."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != '1'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != '1'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt
        if: steps.guard.outputs.skip != '1'

      - name: Run bot
        if: steps.guard.outputs.skip != '1'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_FILTER: ${{ vars.AI_FILTER || 'on' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'auto' }}
        run: python bot/trader.py "${{ github.event.inputs.mode || 'run' }}"

      - name: Save logs to repo
        if: always() && steps.guard.outputs.skip != '1'
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add -A data SCORECARD.md
          git diff --cached --quiet && exit 0
          git commit -q -m "bot: $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
