name: backtest-wide

on:
  workflow_dispatch:
    inputs:
      end_dates:
        description: 'JSON list of window end dates, e.g. ["2017-12-29","2025-12-31"] (each window = months before it)'
        required: true
        default: '["2026-11-19","2025-12-31","2022-12-30","2017-12-29"]'
      months:
        description: "Months per window"
        required: true
        default: "12"
      slippage_bps:
        description: "Slippage per side in basis points, on top of the real bid-ask spread"
        required: true
        default: "3"

permissions:
  contents: write

concurrency:
  group: backtest-wide
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2   # windows share one Alpaca rate limit
      matrix:
        end_date: ${{ fromJSON(github.event.inputs.end_dates) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Run whole-market backtest
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          BT_MONTHS: ${{ github.event.inputs.months }}
          BT_SLIPPAGE_BPS: ${{ github.event.inputs.slippage_bps }}
          BT_END: ${{ matrix.end_date }}
        run: python bot/backtest_wide.py

      - name: Save results to repo
        if: always()
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add -A data/backtest/wide
          git diff --cached --quiet && exit 0
          git commit -q -m "wide backtest ${{ matrix.end_date }}: $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
